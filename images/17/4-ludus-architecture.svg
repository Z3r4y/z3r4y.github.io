<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Ludus 与 PVE 的分层架构</title>
  <desc id="desc">Range 定义输入 Ludus。Packer 从操作系统安装介质构建 PVE Template。Ludus 调用 PVE，从 Template 克隆虚拟机、创建虚拟网络，并形成 Range。Ansible 在 Range 内执行后置配置。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf3fa"/>
    </linearGradient>
    <linearGradient id="ludus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4fa6"/>
      <stop offset="1" stop-color="#2c6acf"/>
    </linearGradient>
    <linearGradient id="range" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17345c" flood-opacity=".09"/>
    </filter>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2c6acf"/>
    </marker>
    <style>
      .section { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: 2px; fill: #687992; }
      .heading { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 29px; font-weight: 600; fill: #17233a; }
      .body { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 21px; fill: #4b5e77; }
      .note { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 18px; fill: #718198; }
      .ludus-heading { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 34px; font-weight: 600; fill: #ffffff; }
      .ludus-body { font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size: 21px; fill: #dbeafe; }
      .node { fill: #ffffff; stroke: #c8d5e4; stroke-width: 1.5; }
      .line { fill: none; stroke: #2c6acf; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#blue-arrow); }
    </style>
  </defs>

  <rect width="1440" height="780" rx="28" fill="url(#background)"/>

  <text x="72" y="99" class="section">部署定义（每次）</text>
  <g filter="url(#shadow)">
    <rect x="72" y="124" width="426" height="106" rx="15" class="node"/>
  </g>
  <text x="104" y="167" class="heading">Range 定义</text>
  <text x="104" y="200" class="body">拓扑、角色、网络与初始状态</text>

  <g filter="url(#shadow)">
    <rect x="604" y="102" width="722" height="116" rx="18" fill="url(#ludus)"/>
  </g>
  <text x="640" y="149" class="ludus-heading">Ludus</text>
  <text x="640" y="184" class="ludus-body">以 Range 为单位编排模板 clone、虚拟网络与生命周期</text>

  <path d="M498 177 H604" class="line"/>
  <text x="510" y="158" class="note">声明</text>

  <g filter="url(#shadow)">
    <rect x="560" y="278" width="810" height="448" rx="22" fill="#ffffff" stroke="#bacadc" stroke-width="1.5"/>
  </g>
  <rect x="560" y="278" width="810" height="70" rx="22" fill="#e6eef8"/>
  <rect x="560" y="324" width="810" height="24" fill="#e6eef8"/>
  <text x="596" y="324" class="heading">PVE</text>
  <text x="1020" y="324" class="body">QEMU/KVM</text>

  <text x="604" y="381" class="section">可复用基础</text>
  <g>
    <rect x="604" y="402" width="306" height="118" rx="15" fill="#f7faff" stroke="#8ab5ec" stroke-width="1.5"/>
    <text x="634" y="444" class="heading">PVE Template</text>
    <text x="634" y="476" class="body">可 clone 的 Golden Image</text>
    <text x="634" y="503" class="note">qcow2、raw 或后端块卷</text>

    <rect x="1020" y="402" width="306" height="118" rx="15" class="node"/>
    <text x="1050" y="444" class="heading">Virtual Network</text>
    <text x="1050" y="476" class="body">Bridge、VLAN 与路由</text>
    <text x="1050" y="503" class="note">定义节点的可达边界</text>
  </g>

  <text x="604" y="560" class="section">运行中的实验环境</text>
  <g filter="url(#shadow)">
    <rect x="604" y="580" width="722" height="108" rx="18" fill="url(#range)" stroke="#8ab5ec" stroke-width="1.5"/>
  </g>
  <text x="638" y="622" class="heading">Range</text>
  <text x="638" y="652" class="body">节点、网络关系与初始状态</text>
  <text x="638" y="678" class="note">DC · Member · Service / Client</text>

  <text x="72" y="381" class="section">镜像构建（一次）</text>
  <g filter="url(#shadow)">
    <rect x="72" y="402" width="172" height="104" rx="15" class="node"/>
    <rect x="306" y="402" width="192" height="104" rx="15" class="node"/>
  </g>
  <text x="158" y="444" text-anchor="middle" class="heading">ISO</text>
  <text x="158" y="476" text-anchor="middle" class="body">系统安装介质</text>
  <text x="402" y="444" text-anchor="middle" class="heading">Packer</text>
  <text x="402" y="476" text-anchor="middle" class="body">无人值守构建</text>
  <path d="M244 454 H306" class="line"/>
  <path d="M498 454 H604" class="line"/>
  <text x="510" y="435" class="note">构建</text>

  <text x="72" y="574" class="section">后置配置（每次）</text>
  <g filter="url(#shadow)">
    <rect x="72" y="596" width="426" height="92" rx="15" class="node"/>
  </g>
  <text x="104" y="633" class="heading">Ansible</text>
  <text x="104" y="664" class="body">域服务、角色、应用与场景服务</text>
  <path d="M498 642 H604" class="line"/>
  <text x="510" y="623" class="note">post-provision</text>

  <path d="M757 218 V402" class="line"/>
  <path d="M1173 218 V402" class="line"/>
  <text x="835" y="258" class="note">调用 PVE</text>
  <path d="M757 520 V580" class="line"/>
  <path d="M1173 520 V580" class="line"/>
  <text x="835" y="550" class="note">clone</text>
  <text x="1150" y="550" class="note">connect</text>
</svg>

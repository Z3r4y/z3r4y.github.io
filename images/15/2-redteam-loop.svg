<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Prompted LLM 红队闭环</title>
  <desc id="desc">攻击者生成候选对话，候选分别经过 activation probe 和 judge，比较结果后反馈到下一轮 ICL。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8f9aa6"/></marker>
    <marker id="mintArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5fd3af"/></marker>
  </defs>
  <rect width="1200" height="600" rx="18" fill="#17191c"/>
  <style>
    .title{font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#eef3f7}
    .label{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#eef3f7}
    .small{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#aeb8c2}
    .formula{font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dce8ef}
    .box{fill:#20252a;stroke:#46505a;stroke-width:2}
    .arrow{stroke:#8f9aa6;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .loop{stroke:#5fd3af;stroke-width:3;fill:none;marker-end:url(#mintArrow)}
  </style>
  <text x="36" y="48" class="title">French Fries：黑盒、反馈驱动的红队闭环</text>
  <text x="36" y="75" class="small">Attacker 只看到候选结果和结构化反馈；每轮 5 个候选，实验最多 20 轮</text>

  <rect x="55" y="145" width="210" height="100" rx="14" class="box" stroke="#5fd3af"/>
  <text x="160" y="180" text-anchor="middle" class="label">Attacker LLM</text>
  <text x="160" y="211" text-anchor="middle" class="small">生成 / 改写候选</text>

  <rect x="335" y="145" width="210" height="100" rx="14" class="box" stroke="#79b7ff"/>
  <text x="440" y="180" text-anchor="middle" class="label">候选 batch</text>
  <text x="440" y="211" text-anchor="middle" class="formula">x₁,…,x₅</text>

  <path d="M265 195 H330" class="arrow"/>

  <rect x="625" y="92" width="245" height="122" rx="14" class="box" stroke="#b99af7"/>
  <text x="747" y="127" text-anchor="middle" class="label">目标模型 + Probe</text>
  <text x="747" y="159" text-anchor="middle" class="formula">A_l(x) → p(x)</text>
  <text x="747" y="190" text-anchor="middle" class="small">分数 / 高低风险标签</text>

  <rect x="625" y="295" width="245" height="122" rx="14" class="box" stroke="#f2ad68"/>
  <text x="747" y="330" text-anchor="middle" class="label">GPT-5-chat Judge</text>
  <text x="747" y="362" text-anchor="middle" class="formula">完整文本 → y</text>
  <text x="747" y="393" text-anchor="middle" class="small">语义标签 / 场景约束</text>

  <path d="M545 175 C575 175 580 153 620 153" class="arrow"/>
  <path d="M545 215 C575 215 580 355 620 355" class="arrow"/>

  <rect x="925" y="180" width="195" height="135" rx="14" class="box" stroke="#ff8c8c"/>
  <text x="1022" y="216" text-anchor="middle" class="label">比较标签</text>
  <text x="1022" y="249" text-anchor="middle" class="formula">y ≠ ŷ_probe?</text>
  <text x="1022" y="283" text-anchor="middle" class="small">FN / FP 或本轮失败</text>

  <path d="M870 153 C900 153 895 224 920 224" class="arrow"/>
  <path d="M870 355 C900 355 895 270 920 270" class="arrow"/>

  <rect x="925" y="380" width="195" height="92" rx="14" class="box" stroke="#5fd3af"/>
  <text x="1022" y="413" text-anchor="middle" class="label">结构化反馈</text>
  <text x="1022" y="443" text-anchor="middle" class="small">成败 + score + 理由</text>

  <path d="M1022 315 V375" class="loop"/>
  <path d="M925 426 C790 535 360 535 160 252" class="loop"/>
  <text x="470" y="555" class="small">保留完整历史 → 下一轮 in-context learning</text>

  <rect x="55" y="355" width="210" height="117" rx="14" fill="#2a2024" stroke="#ff8c8c" stroke-width="2"/>
  <text x="160" y="389" text-anchor="middle" class="label">目标一：FN</text>
  <text x="160" y="421" text-anchor="middle" class="small">y=高风险，probe=低</text>
  <text x="160" y="449" text-anchor="middle" class="small">把风险写得平淡 / 分散</text>

  <rect x="335" y="355" width="210" height="117" rx="14" fill="#2a2520" stroke="#f2ad68" stroke-width="2"/>
  <text x="440" y="389" text-anchor="middle" class="label">目标二：FP</text>
  <text x="440" y="421" text-anchor="middle" class="small">y=低风险，probe=高</text>
  <text x="440" y="449" text-anchor="middle" class="small">堆叠显眼风险词</text>
</svg>

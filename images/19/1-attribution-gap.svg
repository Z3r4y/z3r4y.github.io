<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Axis labels -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#111">
    Attribution Gap：当 Model 与 Architecture 同时变动，性能提升无法归因
  </text>

  <!-- Y axis: Architecture -->
  <line x1="140" y1="470" x2="140" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="70" text-anchor="middle" font-size="13" fill="#333">↑ Architecture 复杂度</text>
  <text x="115" y="460" text-anchor="middle" font-size="11" fill="#666">Plain CLI</text>
  <text x="115" y="115" text-anchor="middle" font-size="11" fill="#666">Multi-agent Harness</text>

  <!-- X axis: Model -->
  <line x1="140" y1="470" x2="720" y2="470" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="720" y="460" text-anchor="end" font-size="13" fill="#333">Model 能力 →</text>
  <text x="240" y="490" text-anchor="middle" font-size="11" fill="#666">旧模型</text>
  <text x="620" y="490" text-anchor="middle" font-size="11" fill="#666">新模型</text>

  <!-- Quadrants -->
  <!-- 左下：baseline -->
  <rect x="160" y="270" width="220" height="180" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
  <text x="270" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Baseline</text>
  <text x="270" y="325" text-anchor="middle" font-size="11" fill="#555">旧模型 + Plain CLI</text>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#888">（几乎没人报这个）</text>

  <!-- 左上：架构贡献可测 -->
  <rect x="160" y="90" width="220" height="180" fill="#e8f2ff" stroke="#3d7bd9" stroke-width="1.5"/>
  <text x="270" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#111">架构贡献可测</text>
  <text x="270" y="145" text-anchor="middle" font-size="11" fill="#555">旧模型 + Harness</text>
  <text x="270" y="175" text-anchor="middle" font-size="10" fill="#3d7bd9">↑ 与 Baseline 差值</text>
  <text x="270" y="192" text-anchor="middle" font-size="10" fill="#3d7bd9">= architecture 独立贡献</text>

  <!-- 右下：模型贡献可测 -->
  <rect x="480" y="270" width="220" height="180" fill="#e8f2ff" stroke="#3d7bd9" stroke-width="1.5"/>
  <text x="590" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#111">模型贡献可测</text>
  <text x="590" y="325" text-anchor="middle" font-size="11" fill="#555">新模型 + Plain CLI</text>
  <text x="590" y="355" text-anchor="middle" font-size="10" fill="#3d7bd9">↑ 与 Baseline 差值</text>
  <text x="590" y="372" text-anchor="middle" font-size="10" fill="#3d7bd9">= model 独立贡献</text>

  <!-- 右上：不可归因（重点） -->
  <rect x="480" y="90" width="220" height="180" fill="#ffecec" stroke="#d94747" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#a01717">现状：无法归因</text>
  <text x="590" y="145" text-anchor="middle" font-size="11" fill="#555">新模型 + Harness</text>
  <text x="590" y="180" text-anchor="middle" font-size="10" fill="#a01717">MAPTA / PentestGPT V2 /</text>
  <text x="590" y="197" text-anchor="middle" font-size="10" fill="#a01717">Red-MIRROR / AWE 都落这</text>
  <text x="590" y="225" text-anchor="middle" font-size="10" fill="#555">↑ 是 model 带的？</text>
  <text x="590" y="242" text-anchor="middle" font-size="10" fill="#555">还是 architecture 带的？</text>

  <!-- 底部注释 -->
  <text x="380" y="515" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    这篇论文的核心方法：补齐右下角与左下角，才能反推右上角里 architecture 真正贡献多少
  </text>
</svg>
